<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Intelligent Water Distribution System</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at top, #0f2b48 0%, #0a192f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-card {
      background: white;
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.5rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .demo-pill-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition);
    }
    .demo-pill-btn:hover {
      background: var(--primary-100);
      border-color: var(--primary-400);
      color: var(--primary-800);
    }
  </style>
</head>
<body>

  <!-- Minimal Brand Header -->
  <nav class="navbar" style="background: transparent; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
    <a href="/" class="nav-brand">
      <div class="nav-brand-icon">
        <i class="fas fa-droplet"></i>
      </div>
      <div class="nav-brand-text">
        <h1 style="color: white; -webkit-text-fill-color: initial;">IWDS Core</h1>
        <p style="color: #94a3b8;">Intelligent Water System</p>
      </div>
    </a>
    <a href="/" class="btn btn-secondary btn-sm" style="background: rgba(255, 255, 255, 0.1); color: white; border-color: rgba(255, 255, 255, 0.2);">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 50px; height: 50px; border-radius: 50%; background: var(--primary-100); color: var(--primary-600); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem;">
          <i class="fas fa-shield-halved"></i>
        </div>
        <h2 style="font-size: 1.6rem; color: var(--primary-900);">Secure Portal Login</h2>
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 0.35rem;">Access Citizen Dashboard or Admin Command Center</p>
      </div>

      <!-- Quick Fill Shortcuts for Viva / Evaluation -->
      <div style="background: #f8fafc; border: 1px dashed var(--border-color); border-radius: var(--radius-md); padding: 0.85rem; margin-bottom: 1.5rem;">
        <div style="font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.35rem;">
          <i class="fas fa-wand-magic-sparkles text-cyan"></i> Quick Autofill Credentials:
        </div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button type="button" class="demo-pill-btn" onclick="fillCreds('ramya@gmail.com', 'ramya123')">
            <i class="fas fa-user"></i> Citizen: Ramya M
          </button>
          <button type="button" class="demo-pill-btn" onclick="fillCreds('admin@water.gov', 'admin123')">
            <i class="fas fa-shield"></i> Admin: Engineer
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email"><i class="fas fa-envelope text-muted"></i> Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required value="ramya@gmail.com">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password"><i class="fas fa-lock text-muted"></i> Password</label>
            <a href="#" style="font-size: 0.78rem; font-weight: 600;" onclick="showToast('Default test passwords are ramya123 and admin123', 'warning'); return false;">Forgot?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="Enter password" required value="ramya123">
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem; font-size: 1rem;">
          <i class="fas fa-arrow-right-to-bracket"></i> Sign In to Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account yet? <a href="/register/" style="font-weight: 700;">Register as Citizen</a>
      </div>

    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    function fillCreds(email, pwd) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pwd;
      showToast(`Autofilled credentials for ${email}`, 'info');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pwd = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      const res = await Auth.login(email, pwd);
      if (res.success) {
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = res.redirect_url;
        }, 600);
      } else {
        showToast(res.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In to Account';
      }
    });
  </script>
</body>
</html>
