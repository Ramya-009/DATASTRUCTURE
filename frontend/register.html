<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Intelligent Water Distribution System</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at top, #0f2b48 0%, #0a192f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .auth-card {
      background: white;
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.5rem;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- Minimal Brand Header -->
  <nav class="navbar" style="background: transparent; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
    <a href="/" class="nav-brand">
      <div class="nav-brand-icon">
        <i class="fas fa-droplet"></i>
      </div>
      <div class="nav-brand-text">
        <h1 style="color: white; -webkit-text-fill-color: initial;">IWDS Core</h1>
        <p style="color: #94a3b8;">Intelligent Water System</p>
      </div>
    </a>
    <a href="/login/" class="btn btn-secondary btn-sm" style="background: rgba(255, 255, 255, 0.1); color: white; border-color: rgba(255, 255, 255, 0.2);">
      <i class="fas fa-arrow-left"></i> Already have account? Login
    </a>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 50px; height: 50px; border-radius: 50%; background: #ecfdf5; color: var(--success); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem;">
          <i class="fas fa-user-plus"></i>
        </div>
        <h2 style="font-size: 1.6rem; color: var(--primary-900);">Citizen Registration</h2>
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 0.35rem;">Register to access water distribution schedules, request supply, and report issues.</p>
      </div>

      <form id="register-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name *</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Ramya M" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="ramya@gmail.com" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-mobile">Mobile Number *</label>
            <input type="tel" id="reg-mobile" class="form-control" placeholder="9876543210" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password (min 6 chars) *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-area">Distribution Area *</label>
            <select id="reg-area" class="form-control" required>
              <option value="">-- Select Municipal Area --</option>
              <option value="1">Poonamallee</option>
              <option value="2">Avadi</option>
              <option value="3">Porur</option>
              <option value="4">Ambattur</option>
              <option value="5">Guindy Industrial</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-house">House Number / Flat *</label>
            <input type="text" id="reg-house" class="form-control" placeholder="e.g. 25, 4th Cross" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-address">Full Street Address *</label>
          <textarea id="reg-address" class="form-control" rows="2" placeholder="e.g. Lakeview Avenue, Poonamallee, Chennai" required></textarea>
        </div>

        <button type="submit" id="btn-reg-submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem; font-size: 1rem;">
          <i class="fas fa-check-circle"></i> Create Citizen Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
        Already registered? <a href="/login/" style="font-weight: 700;">Sign in to account</a>
      </div>

    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    // Fetch areas dynamically to populate dropdown
    fetch('/api/water/areas/')
      .then(res => res.json())
      .then(data => {
        if (data.success && data.areas) {
          const select = document.getElementById('reg-area');
          select.innerHTML = '<option value="">-- Select Municipal Area --</option>' + 
            data.areas.map(a => `<option value="${a.id}">${a.area_name} (${a.location})</option>`).join('');
        }
      })
      .catch(e => console.log('Using default areas dropdown'));

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        mobile: document.getElementById('reg-mobile').value,
        password: document.getElementById('reg-password').value,
        area: document.getElementById('reg-area').value,
        house_number: document.getElementById('reg-house').value,
        address: document.getElementById('reg-address').value,
        role: 'USER'
      };

      const btn = document.getElementById('btn-reg-submit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

      const res = await Auth.register(payload);
      if (res.success) {
        showToast('Registration successful! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = '/login/';
        }, 1200);
      } else {
        showToast(res.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> Create Citizen Account';
      }
    });
  </script>
</body>
</html>
